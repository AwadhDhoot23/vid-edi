services:
  redis:
    image: redis:7-alpine
    container_name: vid-edi-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    container_name: vid-edi-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: videdi
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  redis_data:
  mongo_data:
